{
  "version": "0.1.0",
  "date": "2026-06-12",
  "format_note": "JSON-compatible YAML; parsed without third-party dependencies.",
  "allow_runtime_literature_search": false,
  "allow_per_candidate_literature_search": false,
  "allow_group_level_literature_search": true,
  "group_level_literature_search_mode": "queued_requests_only",
  "allowed_future_triggers": [
    "hazard_pair_not_in_library",
    "mechanism_status_partial",
    "hazard_subtype_out_of_scope",
    "region_scope_missing_for_major_new_region",
    "requested_evidence_gap"
  ],
  "forbidden_triggers": [
    "candidate_label_possible",
    "candidate_label_insufficient",
    "final_label_not_likely",
    "missing_local_public_evidence",
    "weak_pair_linkage",
    "general_mechanism_context_only",
    "missing_agriculture_evidence",
    "missing_response_evidence",
    "agent_uncertainty_without_formal_gap"
  ],
  "invariants": {
    "literature_search_required_must_not_depend_on": [
      "candidate_id",
      "final_label",
      "missing_evidence",
      "pair_linkage_result",
      "agriculture_support",
      "response_support"
    ]
  }
}
