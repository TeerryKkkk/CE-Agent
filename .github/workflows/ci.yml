name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # A regular wheel install exposes files omitted by package discovery.
      - name: Install the project and test dependencies
        run: python -m pip install ".[test]"
      - name: Check installed package imports
        run: >-
          python -I -c "import importlib, pkgutil, climate_pipeline;
          modules = [m.name for m in pkgutil.walk_packages(climate_pipeline.__path__, climate_pipeline.__name__ + '.')];
          [importlib.import_module(name) for name in modules];
          print(f'Imported {len(modules)} installed modules')"
      - name: Run the complete test suite
        run: python -m pytest
      - name: Verify the offline example
        run: python scripts/replay.py --verify --output-dir examples/california40/outputs/replay
      - name: Check that the example leaves the checkout clean
        run: >-
          python -c "import subprocess;
          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True);
          print(status, end='');
          raise SystemExit(bool(status))"
