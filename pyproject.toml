[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ce-agent"
version = "0.1.0"
description = "Compound-event evidence retrieval, validation, and deterministic replay."
requires-python = ">=3.11"
dependencies = ["tiktoken>=0.7,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["climate_pipeline*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
